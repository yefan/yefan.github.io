<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#09090b">
  <title>{{PAGE_TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="canonical" href="{{SITE_URL}}">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{NAME}}">
  <meta property="og:url" content="{{SITE_URL}}">
  <meta property="og:title" content="{{PAGE_TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:image" content="{{IMAGE_URL}}">
  <meta property="og:image:alt" content="Illustrated portrait of {{NAME}}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{PAGE_TITLE}}">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <meta name="twitter:image" content="{{IMAGE_URL}}">
  <meta name="twitter:image:alt" content="Illustrated portrait of {{NAME}}">
  <script type="application/ld+json">{{STRUCTURED_DATA}}</script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script>try { if (localStorage.getItem('ye-fan-theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch {}</script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"><div class="wrap header-inner">
    <a class="wordmark" href="#top">Ye Fan</a>
    <nav aria-label="Main navigation"><a href="#products">Products</a><a href="#research">Research</a><button class="theme-toggle" type="button" aria-label="Switch to light mode" title="Switch to light mode">{{SUN}}{{MOON}}</button></nav>
  </div></header>
  <main class="wrap" id="main">
    <section class="profile-card" id="top" aria-labelledby="profile-name">
      <div class="profile-heading"><img class="portrait" src="assets/ye-fan.png" alt="Illustrated portrait of Ye Fan" width="84" height="84"><div><h1 id="profile-name">{{NAME}}</h1><p class="location">{{PIN}}{{LOCATION}}</p></div></div>
      <div class="profile-intro">{{INTRO}}</div>
      <div class="profile-links"><a href="mailto:{{EMAIL}}">{{MAIL}}Email</a><a href="{{LINKEDIN}}" target="_blank" rel="noopener noreferrer">{{LINKEDIN_ICON}}LinkedIn<span class="sr-only"> (opens in a new tab)</span></a><a href="{{GITHUB}}" target="_blank" rel="noopener noreferrer">{{GITHUB_ICON}}GitHub<span class="sr-only"> (opens in a new tab)</span></a></div>
    </section>
    <section class="section" id="products" aria-labelledby="products-heading"><h2 id="products-heading">Products</h2><ul class="work-list" role="list">{{WORK}}</ul></section>
    <section class="section" id="research" aria-labelledby="research-heading"><h2 id="research-heading">Selected Publication</h2><div class="research-list">{{RESEARCH}}</div></section>
  </main>
  <footer class="wrap site-footer"><span>© {{YEAR}} {{NAME}}</span></footer>
  <!-- Cloudflare Web Analytics -->
  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "6466eacf1b644034ab0a443ccde57170"}'></script>
  <!-- End Cloudflare Web Analytics -->
</body>
</html>
